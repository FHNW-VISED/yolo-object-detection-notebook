[project]
name = "yolo-object-detection-notebook"
version = "0.1.0"
description = "Object Detection with YOLO"
requires-python = ">=3.12,<3.13"  # Colab's Python line; keep in step with SPEC.md › Environment
# Runtime deps = what the notebook imports. Prefer packages Colab preinstalls; pin to the Colab
# version recorded in SPEC.md › Environment so the smoke run sees what students see.
dependencies = [
    "numpy",
    "matplotlib",
    "ultralytics>=8.4.208",
    "ipywidgets>=8.1.9",
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "pytest>=8",
    "ruff>=0.6",
    "jupyterlab>=4",
    "markdown>=3.11.2",
    "markdownify>=0.13",
    "huggingface-hub>=2.4.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E402"]  # notebook sections import where they are taught

[tool.ruff.lint.isort]
known-first-party = ["build"]  # scripts/build.py; else a local build/ folder decides how imports sort

[tool.ruff.lint.per-file-ignores]
"sections/*.py" = ["F821", "F811", "E501", "F401"]  # one shared kernel: names come from, and imports serve, other sections; E501: box HTML

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
